    api-key: "sk-xxxxxxxxxxxxxxxxxxxxxxxx" # 替换为真实的通义千问API Key

# 缺失的阿里云 OSS 配置补在这里：
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com # 替换为您的真实 endpoint
    access-key-id: your_access_key_id      # 替换为您的真实 AK
    access-key-secret: your_access_key_secret # 替换为您的真实 SK
    bucket-name: wuyi-mall-bucket          # 替换为您在 OSS 创建的 Bucket 名称