    password: a1228671503
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  # Spring Boot 上传文件大小限制配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.wuyi.mall.entity

server:
  port: 8080

ai:
